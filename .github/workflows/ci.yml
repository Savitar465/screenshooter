# Compila y pasa los tests en Linux, Windows y macOS en cada push y pull request.
# En Linux genera además los paquetes (.deb, .tar.gz y AppImage) como artefactos.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  QT_VERSION: '6.7.3'

jobs:
  linux:
    name: Linux (build, tests, deb, AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: ''
          tools: 'tools_ninja'
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libfuse2 file
      - name: Configurar
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Compilar
        run: cmake --build build
      - name: Tests
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Capturas de pantalla (humo de la UI)
        run: |
          QT_QPA_PLATFORM=offscreen QAFLOW_SNAPSHOT_DIR=$PWD/build/shots ./build/qaflow
          ls build/shots/*.png
      - name: Paquetes .deb y .tar.gz
        run: cpack --config build/CPackConfig.cmake -B build/packages
      - name: AppImage
        run: packaging/linux/build-appimage.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: qaflow-linux
          path: |
            build/packages/*.deb
            build/packages/*.tar.gz
            build/*.AppImage
            build/shots/*.png
          if-no-files-found: error

  windows:
    name: Windows (build, tests, instalador)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2019_64
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configurar
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Compilar
        run: cmake --build build
      - name: Tests
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Instalador NSIS y .zip
        run: cpack --config build/CPackConfig.cmake -B build/packages
      - uses: actions/upload-artifact@v4
        with:
          name: qaflow-windows
          path: |
            build/packages/*.exe
            build/packages/*.zip
          if-no-files-found: error

  macos:
    name: macOS (build, tests, dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Configurar
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Compilar
        run: cmake --build build
      - name: Tests
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Imagen .dmg
        run: cpack --config build/CPackConfig.cmake -B build/packages
      - uses: actions/upload-artifact@v4
        with:
          name: qaflow-macos
          path: build/packages/*.dmg
          if-no-files-found: error

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Adjuntar paquetes a la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/qaflow-linux/**/*.deb
            artifacts/qaflow-linux/**/*.tar.gz
            artifacts/qaflow-linux/**/*.AppImage
            artifacts/qaflow-windows/**/*.exe
            artifacts/qaflow-windows/**/*.zip
            artifacts/qaflow-macos/**/*.dmg
          generate_release_notes: true
