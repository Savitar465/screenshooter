# Compila y pasa los tests en Linux, Windows y macOS en cada push y pull request.
# En Linux genera además los paquetes como artefactos:
#   - AppImage y .tar.gz portátil, con Qt dentro (Ubuntu 22.04 + Qt de aqt, glibc antigua = más distros).
#   - .deb, compilado en Debian 12 con el Qt de la distro, que declara como dependencia
#     (sirve en Debian 12+, Ubuntu 24.04+ y derivadas).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  QT_VERSION: '6.7.3'

jobs:
  # La versión de la app: en un tag vX.Y.Z[-pre], la del tag (todos los builds la reciben al configurar, así
  # el binario y los paquetes dicen la versión de su release); en el resto de builds, vacía, y CMake usa la
  # de CMakeLists.txt.
  version:
    name: Versión
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        name: Versión del tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::El tag $GITHUB_REF_NAME no es vX.Y.Z ni vX.Y.Z-pre (v1.6.0, v1.6.0-beta.1)"
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "Versión de la release: $version"
          else
            echo "No es un tag de versión: se usa la de CMakeLists.txt"
          fi

  linux:
    needs: version
    name: Linux (build, tests, AppImage, tar.gz)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: ''
          tools: 'tools_ninja'
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libfuse2 file libx11-dev libxcb1-dev
      - name: Configurar
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQAFLOW_VERSION=${{ needs.version.outputs.version }}
      - name: Compilar
        run: cmake --build build
      - name: Tests
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Capturas de pantalla (humo de la UI)
        run: |
          QT_QPA_PLATFORM=offscreen QAFLOW_SNAPSHOT_DIR=$PWD/build/shots ./build/qaflow
          ls build/shots/*.png
      - name: AppImage y .tar.gz
        run: packaging/linux/build-appimage.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: qaflow-linux
          path: |
            build/*.tar.gz
            build/*.AppImage
            build/shots/*.png
          if-no-files-found: error

  linux-deb:
    needs: version
    name: Linux (.deb con el Qt del sistema)
    runs-on: ubuntu-22.04
    container: debian:12
    steps:
      - name: Dependencias del sistema
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential cmake ninja-build file dpkg-dev \
            qt6-base-dev qt6-tools-dev qt6-l10n-tools qt6-qpa-plugins libgl-dev zlib1g-dev libx11-dev libxcb1-dev
      - uses: actions/checkout@v4
      - name: Configurar
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQAFLOW_VERSION=${{ needs.version.outputs.version }}
      - name: Compilar
        run: cmake --build build
      - name: Tests
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Paquete .deb
        run: |
          cpack --config build/CPackConfig.cmake -B build/packages
          dpkg-deb -I build/packages/*.deb
          # Sin Qt en Depends el paquete no arranca en otra máquina: mejor fallar aquí.
          dpkg-deb -f build/packages/*.deb Depends | grep -q libqt6widgets6
      - uses: actions/upload-artifact@v4
        with:
          name: qaflow-linux-deb
          path: build/packages/*.deb
          if-no-files-found: error

  windows:
    needs: version
    name: Windows (build, tests, instalador)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2019_64
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configurar
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQAFLOW_VERSION=${{ needs.version.outputs.version }}
      - name: Compilar
        run: cmake --build build
      - name: Tests
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Mostrar detalle de QtTest
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem build/test-results/*.txt -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Output "--- $($_.Name) ---"
            Get-Content $_.FullName
          }
      - name: Guardar resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qaflow-windows-test-results
          path: |
            build/test-results/*.txt
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
      - name: Instalador NSIS y .zip
        run: cpack --config build/CPackConfig.cmake -B build/packages
      - uses: actions/upload-artifact@v4
        with:
          name: qaflow-windows
          path: |
            build/packages/*.exe
            build/packages/*.zip
          if-no-files-found: error

  macos:
    needs: version
    name: macOS (build, tests, dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Configurar
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQAFLOW_VERSION=${{ needs.version.outputs.version }}
      - name: Compilar
        run: cmake --build build
      - name: Tests
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Imagen .dmg
        run: cpack --config build/CPackConfig.cmake -B build/packages
      - uses: actions/upload-artifact@v4
        with:
          name: qaflow-macos
          path: build/packages/*.dmg
          if-no-files-found: error

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, linux, linux-deb, windows, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Cada paquete lleva la versión en el nombre: si falta alguno, ese build no recibió la del tag.
      - name: Comprobar la versión de los paquetes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          deb_version="${VERSION//-/\~}"   # dpkg escribe las versiones previas con "~"
          for name in "QAflow-$VERSION-x86_64.AppImage" "qaflow-$VERSION-Linux-x86_64.tar.gz" "qaflow_${deb_version}_*.deb" \
                      "qaflow-$VERSION-win64.exe" "qaflow-$VERSION-win64.zip" "qaflow-$VERSION-Darwin.dmg"; do
            if ! find artifacts -type f -name "$name" | grep -q .; then
              echo "::error::Falta $name: algún paquete no se compiló con la versión $VERSION del tag"
              find artifacts -type f -not -name '*.png'
              exit 1
            fi
          done
      # Lo que comprueba QAflow antes de instalarse sola: la suma de cada paquete y la firma Ed25519 de esas
      # sumas con la clave del secreto QAFLOW_UPDATE_SIGNING_KEY (packaging/release/update-signing-key.sh).
      # Sin el secreto la release sale igual, sin firma: QAflow avisará de ella pero no se instalará sola.
      - name: Sumas y firma para las actualizaciones
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.QAFLOW_UPDATE_SIGNING_KEY }}
        run: |
          mkdir -p artifacts/checksums
          cd artifacts
          find qaflow-linux qaflow-linux-deb qaflow-windows qaflow-macos -type f \
               \( -name '*.deb' -o -name '*.tar.gz' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.zip' -o -name '*.dmg' \) -print0 \
            | sort -z | xargs -0 sha256sum | sed -E 's#^([0-9a-f]{64})  .*/#\1  #' > checksums/SHA256SUMS
          cat checksums/SHA256SUMS
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            key="$RUNNER_TEMP/update-signing-key.pem"
            printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
            openssl pkeyutl -sign -rawin -inkey "$key" -in checksums/SHA256SUMS -out checksums/SHA256SUMS.sig
            rm -f "$key"
          else
            echo "::warning::Falta el secreto QAFLOW_UPDATE_SIGNING_KEY: la release sale sin firma y QAflow no se instalará sola"
          fi
      - name: Adjuntar paquetes a la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/qaflow-linux-deb/**/*.deb
            artifacts/qaflow-linux/**/*.tar.gz
            artifacts/qaflow-linux/**/*.AppImage
            artifacts/qaflow-windows/**/*.exe
            artifacts/qaflow-windows/**/*.zip
            artifacts/qaflow-macos/**/*.dmg
            artifacts/checksums/SHA256SUMS
            artifacts/checksums/SHA256SUMS.sig
          generate_release_notes: true
          # Una versión previa (v1.6.0-beta.1) sale como prerelease: sólo la ofrece el canal beta.
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
