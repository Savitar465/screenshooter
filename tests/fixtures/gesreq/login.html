<div class="form-login">
    <div class="panel panel-default">
        <div class="panel-heading">

        <form name="AuthForm" method="post" action="/greq/login.do;jsessionid=FAKESESSION!-1" class="panel-body" style="padding: 15px;">

            </div>

            <div class="input-group bottom">
                <input type="password" name="clave" class="form-control" value="" placeholder="Contraseña" />

            </div>


            <button class="btn btn-primary btn-block" type="submit">Ingresar</button>
